name: Apnorix Music Android APK

on:
  push:
    branches: [apnorix-music-player]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'rust_backend/**'
      - 'scripts/**'
      - 'third_party/**'
      - 'pubspec*'
      - '.fvmrc'
      - '.github/workflows/apnorix-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apnorix-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MORNYE_DISCORD_SDK: '0'
      MORNYE_RUST_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Build original Mornye-based Apnorix Music APK
        run: |
          flutter pub get
          bash scripts/build_android.sh --lite
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Apnorix-Music-Android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
